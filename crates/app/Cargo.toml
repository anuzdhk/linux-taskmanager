[package]
name = "taskmonitor"
description = "A modern task manager for Linux"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
taskmonitor-core = { path = "../core" }
# Renders app icons (already built into Slint; this exposes it). No text/system fonts:
# icons don't need them, and loading the system font database is slow.
resvg = { version = "0.48.1", default-features = false }
# Software renderer only: the OpenGL path loads ~100 MB of Mesa/NVIDIA driver libraries
# (and can wake a sleeping dGPU), while this UI only repaints small regions once a second.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }
pprof = { version = "0.15.0", optional = true }
nix = { version = "0.31.3", default-features = false }
zbus = "5.19"
serde_json = "1.0.154"

# ARM64 packages are cross-built, with no ARM fontconfig to link against: load it at
# run time instead (Slint's font library, enabled here only to switch this on).
[target.'cfg(target_arch = "aarch64")'.dependencies]
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"] }

# `packaging/build-deb.sh` builds everything and runs cargo-deb.
[package.metadata.deb]
name = "taskmonitor"
maintainer = "anuz <anuzsystem@gmail.com>"
copyright = "2026 anuz"
section = "admin"
priority = "optional"
extended-description = """\
A modern task manager for Linux: apps and processes with CPU, memory, disk and GPU \
use, live performance graphs, services, startup apps, users and app history."""
# Spelled out instead of "$auto": the release binary is linked against glibc 2.28 and
# loads libpthread/libdl itself, but dpkg-shlibdeps would demand libc6 >= 2.34 and block
# Ubuntu 20.04 / Debian 11. pkexec runs the helper for actions on processes you don't own.
depends = "libc6 (>= 2.28), libfontconfig1, pkexec | policykit-1"
assets = [
    ["target/release/taskmonitor", "usr/bin/", "755"],
    # Root helper for actions on other users' processes; pkexec finds it here.
    ["target/release/taskmonitor-helper", "usr/libexec/", "755"],
    ["../../packaging/io.github.taskmonitor.policy", "usr/share/polkit-1/actions/", "644"],
    ["../../packaging/io.github.taskmonitor.desktop", "usr/share/applications/", "644"],
    ["../../packaging/io.github.taskmonitor.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/icons/hicolor/scalable/apps/io.github.taskmonitor.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/icons/hicolor/16x16/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../packaging/icons/hicolor/22x22/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/22x22/apps/", "644"],
    ["../../packaging/icons/hicolor/24x24/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../packaging/icons/hicolor/32x32/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../packaging/icons/hicolor/48x48/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../packaging/icons/hicolor/64x64/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../packaging/icons/hicolor/128x128/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../packaging/icons/hicolor/256x256/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../packaging/icons/hicolor/512x512/apps/io.github.taskmonitor.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../LICENSE", "usr/share/doc/taskmonitor/LICENSE", "644"],
    ["fonts/OFL.txt", "usr/share/doc/taskmonitor/fonts/Mona-Sans-OFL.txt", "644"],
    ["fonts/LUCIDE-LICENSE", "usr/share/doc/taskmonitor/fonts/Lucide-LICENSE", "644"],
]

# Fedora / openSUSE / RHEL package: `packaging/build-all.sh` runs cargo-generate-rpm.
[package.metadata.generate-rpm]
summary = "A modern task manager for Linux"
# Dependencies are declared by hand, by library soname and file path (not package
# name) so they resolve on Fedora, RHEL and openSUSE alike. The automatic scan ran
# ldd on the build machine and recorded fontconfig's own dependencies under
# Ubuntu's sonames (libbz2.so.1.0), which Fedora 44 can't satisfy.
auto-req = "no"
assets = [
    { source = "target/release/taskmonitor", dest = "/usr/bin/taskmonitor", mode = "755" },
    { source = "target/release/taskmonitor-helper", dest = "/usr/libexec/taskmonitor-helper", mode = "755" },
    { source = "../../packaging/io.github.taskmonitor.policy", dest = "/usr/share/polkit-1/actions/io.github.taskmonitor.policy", mode = "644" },
    { source = "../../packaging/io.github.taskmonitor.desktop", dest = "/usr/share/applications/io.github.taskmonitor.desktop", mode = "644" },
    { source = "../../packaging/io.github.taskmonitor.metainfo.xml", dest = "/usr/share/metainfo/io.github.taskmonitor.metainfo.xml", mode = "644" },
    { source = "../../packaging/icons/hicolor/scalable/apps/io.github.taskmonitor.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.taskmonitor.svg", mode = "644" },
    { source = "../../packaging/icons/hicolor/16x16/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/22x22/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/22x22/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/24x24/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/24x24/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/32x32/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/48x48/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/64x64/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/128x128/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/256x256/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/512x512/apps/io.github.taskmonitor.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.taskmonitor.png", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/taskmonitor/LICENSE", mode = "644" },
    { source = "fonts/OFL.txt", dest = "/usr/share/licenses/taskmonitor/Mona-Sans-OFL.txt", mode = "644" },
    { source = "fonts/LUCIDE-LICENSE", dest = "/usr/share/licenses/taskmonitor/Lucide-LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libc.so.6(GLIBC_2.28)(64bit)" = "*"
"libfontconfig.so.1()(64bit)" = "*"
# Loaded at runtime (not linked) for keyboard input.
"libxkbcommon.so.0()(64bit)" = "*"
# Runs the helper for actions on other users' processes.
"/usr/bin/pkexec" = "*"

[features]
# In-process CPU profiler for the headless benchmark (`TASKMONITOR_BENCH=1`).
profiling = ["dep:pprof"]

[build-dependencies]
slint-build = "1.18"


