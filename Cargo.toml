[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/helper"]

[workspace.package]
version = "0.1.3"
edition = "2024"
publish = false
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds snappy: optimise dependencies (Slint's renderer) but not our code.
[profile.dev.package."*"]
opt-level = 2
